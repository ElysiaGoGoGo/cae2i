name: Build

on:
  push:
    # Branch pushes: build only.
    branches: [ '**' ]
    # Tag pushes: build, then publish a GitHub Release with the built jar.
    tags: [ '**' ]
  pull_request:

# Creating/updating a Release needs write access; the default token may be read-only.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history + tags so generate_release_notes can diff against the previous tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      # Runs only for tag pushes (pull_request refs never start with refs/tags/).
      # Updates the release if one already exists for this tag.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
